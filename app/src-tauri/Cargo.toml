[package]
name = "visual-brain-app"
version = "0.2.65"
edition = "2021"
description = "Finestra nativa del Visual Brain: avvia il server locale e mostra la mappa"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Drops of items that are not files on disk (promised files, image data): read from the drag pasteboard.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSData", "NSDictionary", "NSError", "NSOperation", "NSString", "NSURL", "NSGeometry", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSPasteboard", "NSFilePromiseReceiver", "NSBitmapImageRep", "NSImageRep", "NSWindow", "NSView", "NSResponder", "NSButton", "NSControl"] }
