[package]
name = "vb-indexer"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native filesystem walker for Visual Brain (optional; the TypeScript walker stays the fallback)."

[[bin]]
name = "vb-indexer"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
